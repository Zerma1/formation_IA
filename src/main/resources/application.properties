spring.application.name=ia-spring-lab

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/iaspringlab}
spring.datasource.username=${DB_USERNAME:iaspringlab}
spring.datasource.password=${DB_PASSWORD:iaspringlab}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
