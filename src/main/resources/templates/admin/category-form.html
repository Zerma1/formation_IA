<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Modifier la catégorie')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="container narrow">
    <h1>Modifier la catégorie</h1>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <form class="card form" th:object="${form}" method="post"
          th:action="@{/admin/categories/{id}(id=${categoryId})}">
        <label for="name">Nom</label>
        <input id="name" type="text" th:field="*{name}" th:errorclass="invalid">
        <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>

        <div class="form-actions">
            <a class="btn btn-ghost" th:href="@{/admin/categories}">Annuler</a>
            <button type="submit" class="btn btn-primary">Enregistrer</button>
        </div>
    </form>
</main>
</body>
</html>
