<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Panier')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="container">
    <h1>Mon panier</h1>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="card empty" th:if="${cart == null}">
        <p>Votre panier est vide.</p>
        <a class="btn btn-primary" th:href="@{/shop}">Parcourir le catalogue</a>
    </div>

    <th:block th:if="${cart != null}">
        <p class="muted">Votre panier est enregistré en brouillon tant que vous n'avez pas cliqué sur « Commander ».</p>
        <table class="table">
            <thead>
            <tr>
                <th>Produit</th>
                <th class="num">Prix unitaire</th>
                <th>Quantité</th>
                <th class="num">Total</th>
                <th class="actions"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="line : ${cart.lines()}">
                <td>
                    <strong th:text="${line.productName()}">Produit</strong>
                    <div class="muted" th:text="${line.productReference()}">REF</div>
                </td>
                <td class="num" th:insert="~{fragments/layout :: money(${line.unitPrice()})}"></td>
                <td>
                    <form class="qty-form" th:action="@{/shop/cart/lines/{id}(id=${line.id()})}" method="post">
                        <input type="number" name="quantity" min="1" required th:value="${line.quantity()}" aria-label="Quantité">
                        <button type="submit" class="btn btn-small">Mettre à jour</button>
                    </form>
                </td>
                <td class="num" th:insert="~{fragments/layout :: money(${line.lineTotal()})}"></td>
                <td class="actions">
                    <form th:action="@{/shop/cart/lines/{id}/delete(id=${line.id()})}" method="post">
                        <button type="submit" class="btn btn-small btn-danger">Retirer</button>
                    </form>
                </td>
            </tr>
            </tbody>
            <tfoot>
            <tr>
                <th colspan="3" class="num">Total</th>
                <th class="num" th:insert="~{fragments/layout :: money(${cart.total()})}"></th>
                <th></th>
            </tr>
            </tfoot>
        </table>

        <div class="form-actions">
            <a class="btn btn-ghost" th:href="@{/shop}">Continuer mes achats</a>
            <form th:action="@{/shop/cart/checkout}" method="post">
                <button type="submit" class="btn btn-primary">Commander</button>
            </form>
        </div>
    </th:block>
</main>
</body>
</html>
