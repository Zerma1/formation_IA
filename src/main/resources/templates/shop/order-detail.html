<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${'Commande n°' + order.id()})}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="container">
    <div class="page-header">
        <h1 th:text="'Commande n°' + ${order.id()}">Commande</h1>
        <a class="btn btn-ghost" th:href="@{/shop/orders}">← Mes commandes</a>
    </div>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <p>
        <span th:text="${#temporals.format(order.createdAt(), 'dd/MM/yyyy HH:mm')}">01/01/2026</span>
        · <span th:replace="~{fragments/layout :: status(${order.status()})}"></span>
    </p>

    <table class="table">
        <thead>
        <tr>
            <th>Produit</th>
            <th class="num">Prix unitaire</th>
            <th class="num">Quantité</th>
            <th class="num">Total</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="line : ${order.lines()}">
            <td>
                <strong th:text="${line.productName()}">Produit</strong>
                <div class="muted" th:text="${line.productReference()}">REF</div>
            </td>
            <td class="num" th:insert="~{fragments/layout :: money(${line.unitPrice()})}"></td>
            <td class="num" th:text="${line.quantity()}">1</td>
            <td class="num" th:insert="~{fragments/layout :: money(${line.lineTotal()})}"></td>
        </tr>
        </tbody>
        <tfoot>
        <tr>
            <th colspan="3" class="num">Total</th>
            <th class="num" th:insert="~{fragments/layout :: money(${order.total()})}"></th>
        </tr>
        </tfoot>
    </table>
</main>
</body>
</html>
